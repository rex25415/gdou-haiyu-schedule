name: 🐛 异常与显示问题反馈
description: 反馈闪退、同步异常、界面错位或校区错峰时间偏差（请勿粘贴学号/姓名等个人隐私）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请**切勿附带学号、姓名、密码或完整个人成绩截图**，以免泄露个人隐私。
        可在 App「设置 → 应用更新、分享与开源合规 → 反馈与诊断 → 复制纯脱敏环境信息」一键粘贴到下方。
  - type: textarea
    id: env
    attributes:
      label: 环境信息（可直接粘贴 App 复制的脱敏信息）
      placeholder: "海屿空间 v3.3.0 | Android 15 | 校区：海滨 | 课表密度：标准舒适"
    validations:
      required: true
  - type: dropdown
    id: campus
    attributes:
      label: 所在校区
      options:
        - 湖光主校区
        - 海滨校区
        - 阳江校区
        - 其他 / 不涉及校区
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤
      description: 请尽量说清楚在哪一页、点了什么之后出现了什么现象，如有打码截图也可以直接拖进来。
    validations:
      required: true
