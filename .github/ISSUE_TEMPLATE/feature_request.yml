name: 💡 功能建议与体验优化
description: 提出新功能想法或交互细节改进建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与痛点
      description: 你在校园日常使用中遇到了什么不方便的地方？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的实现方式
      description: 希望它怎么工作？（项目坚持纯本地、零后端、零广告、零多余权限原则）
    validations:
      required: true
